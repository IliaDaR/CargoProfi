name: cargo_app
description: Рабочий кабинет перевозчика
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State
  provider: ^6.1.0

  # Local storage (offline fallback)
  shared_preferences: ^2.3.0

  # Firebase
  firebase_core: ^3.12.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  cloud_functions: ^5.2.0
  firebase_storage: ^12.4.0

  # GPS / Location
  geolocator: ^12.0.0

  # Camera & Gallery
  image_picker: ^1.1.0

  # UI
  intl: ^0.19.0
  url_launcher: ^6.3.0

  # PDF generation
  pdf: ^3.11.0
  printing: ^5.13.0

  # Map
  flutter_map: ^7.0.0
  latlong2: ^0.9.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
