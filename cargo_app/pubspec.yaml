name: cargo_app
description: Рабочий кабинет перевозчика
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State
  provider: ^6.1.0
  http: ^1.2.0

  # Local storage (offline fallback)
  shared_preferences: ^2.3.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  flutter_image_compress: ^2.1.0
  flutter_background_service: ^5.0.0
  workmanager: ^0.5.0
  device_info_plus: ^9.1.0
  flutter_secure_storage: ^9.0.0

  # Crypto (SHA-256 for offline password hashing)
  crypto: ^3.0.6

  # GPS / Location
  geolocator: ^12.0.0

  # Camera & Gallery
  image_picker: ^1.1.0

  # UI
  intl: ^0.19.0
  url_launcher: ^6.3.0

  # PDF generation
  pdf: ^3.11.0
  printing: ^5.13.0
  qr: ^3.0.2

  # Map
  flutter_map: ^7.0.0
  latlong2: ^0.9.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
