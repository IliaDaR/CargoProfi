name: Сборка и деплой

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  build-web:
    name: Сборка Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        working-directory: cargo_app
        run: flutter pub get

      - name: Сборка Flutter Web
        working-directory: cargo_app
        run: flutter build web --release

      - name: Копирование админки
        run: rm -rf website/admin && cp -r cargo_app/build/web website/admin

      - name: Архивация сайта
        run: cd website && zip -r ../numino-site.zip ./*

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: numino-site
          path: numino-site.zip
          retention-days: 30

      - name: Деплой на GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website
          publish_branch: gh-pages

  build-android:
    name: Сборка Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        working-directory: cargo_app
        run: flutter pub get

      - name: Сборка APK владельца
        working-directory: cargo_app
        run: flutter build apk --debug

      - name: Сохранить APK владельца
        run: cp cargo_app/build/app/outputs/flutter-apk/app-debug.apk numino-owner.apk

      - name: Сборка APK водителя
        working-directory: cargo_app
        run: flutter build apk --debug -t lib/main_driver.dart

      - name: Сохранить APK водителя
        run: cp cargo_app/build/app/outputs/flutter-apk/app-debug.apk numino-driver.apk

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: numino-apks
          path: |
            numino-owner.apk
            numino-driver.apk
          retention-days: 30
